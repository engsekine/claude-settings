# prod デプロイ（028-deploy-pipeline / US2）
# main へのマージ（push）で起動し、承認者の承認 1 回を経てから prod へ反映する（FR-006 / SC-002）。
# 承認は required reviewers 付きの Environment `production-approval` をゲートジョブに置いて実現し、
# シークレットは reviewers なしの `production` に分離する（research 3 の 2 環境方式）。
name: Deploy (production)

on:
    push:
        branches: [main]

# 同一環境への実行は直列化し、実行中デプロイは完走させる（追い越し防止 / FR-009）
concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # 承認だけを担う空ジョブ。ここが承認されるまで prod は一切変更されない（US2-AC2）
    approve:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        environment: production-approval
        steps:
            - name: Approved
              run: echo "production deploy approved by reviewer"

    deploy:
        needs: approve
        uses: ./.github/workflows/_deploy.yml
        with:
            environment: production
        secrets: inherit
