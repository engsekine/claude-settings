# 軽量品質チェック（手動実行）
# 仕様: specs/005-github-actions-ci/
# 自動トリガー（PR / main push）は手動運用への移行で廃止（2026-07-17）。
# Actions タブの「Run workflow」から対象ブランチを選んで実行する。
# 注意: branch protection の required checks に CI のジョブを指定している場合、
# チェックが自動では走らなくなるため保護設定側の見直しが必要。
name: CI

on:
    workflow_dispatch:

# 同一 ref の旧実行をキャンセル（FR-003）。main は完走させる
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GITHUB_TOKEN は最小権限に固定（npm ci は依存の install スクリプトを実行するため、
# サプライチェーン侵害時に書き込み可能トークンが窃取されるのを防ぐ）
permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check --workspace service-front

    lint-admin:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check --workspace admin-front

    markup-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint:markup --workspace service-front

    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run type-check --workspace service-front

    type-check-admin:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run type-check --workspace admin-front

    unit-test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # カバレッジ閾値（70%）の検証を含む（FR-004）
            - run: npm run test:coverage --workspace service-front

    unit-test-admin:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run test:coverage --workspace admin-front

    db-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            # config.toml の auth.email.smtp.enabled が env(SMTP_ENABLED) を参照するため、
            # 未定義だと supabase CLI が config パースで失敗する。CI はメール実送信しないので false 固定
            SMTP_ENABLED: false
        steps:
            - uses: actions/checkout@v4
            - uses: supabase/setup-cli@v1
              with:
                  # version: latest は実行のたびに GitHub API で最新リリースを解決するため、
                  # 未認証のレート制限に達して失敗する。バージョンを固定して API 解決を回避する。
                  version: 2.107.0
            # lint はローカル DB への接続が必要。フルスタックではなく DB コンテナのみ起動する（FR-005）
            - run: supabase db start
            - run: supabase db lint

    # モバイルアプリ + 共有パッケージ（029）
    mobile:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # 共有パッケージ（dive スキーマ・転送変換）
            - run: npm run test --workspace packages/core
            - run: npm run type-check --workspace packages/core
            # モバイル（純粋ロジック = Vitest / RN コンポーネント = jest-expo / 型）
            - run: npm run test:unit --workspace mobile
            - run: npm run test:component --workspace mobile
            - run: npm run type-check --workspace mobile
